# HDSH 端侧 profile —— 用户 patch 层
#
# dsh 的 patch 应用顺序（见 D6 §5.3）：
#   bundle 层 patch（按 dsh.profile.bundles 顺序）
#     → 本文件（profile 的 cordis.patch.yml）
#     → $DSH_HOME/cordis.patch.yml
#     → --patch 覆盖层
# 本文件里的覆盖**整块替换**目标行的 config；`{insert: […]}` 是追加。
#
# ── 纪律 ────────────────────────────────────────────────────────────────
# 只放**有证据支持**的覆盖，每条都写清证据与恢复条件。
#
# ── 判别口径（哪些该禁、哪些必须留）──────────────────────────────────────
# 判据不是"用了原生模块就禁"，而是**这件事在鸿蒙上能否直接实现**：
#   · koffi（FFI）**能用**：我们已用应用自身的 OHOS 工具链自建 3.2.1（D6 E51），
#     DT_NEEDED 结构性满足。所以 `web-startup` / `web-runtime` / `session-persistence-jsonl`
#     这些"经由 koffi"的行**必须保留**——`web-startup` 正是起 webserver 的那一行，
#     禁掉它 Host 就永远不会监听（这就是早先"runProfile 返回了但没有 webServer"的成因链）。
#   · node-pty（PTY + `spawn-helper`）**不能用**：要 `posix_openpt`/`forkpty` 并
#     **创建进程**执行同目录下的 `spawn-helper`，而鸿蒙对应用创建进程有平台级限制（D6 E15）。
#     依赖它的整条链都得禁（见下）。
#   · sharp/libvips **不能用**：缺 `libvips-cpp.so.42`、且其加载器要建软链（沙箱禁止），
#     WASM 回退在 `--jitless` 下必失败（D6 E46）。
# 另外：koffi 3.x 是**刚自建**的（E51）。在只有 2.16.2 移植版的那段时间里，
# “经由 koffi”的行会因 2.x↔3.x 代差而加载失败（E47），那份禁用是为了先跑通主流程的
# **临时**措施；koffi 3.x 到位后，与 koffi 有关的临时禁用全部撤销（见下）。

# ── 永久禁用（鸿蒙上无法直接实现）────────────────────────────────────────

# ⓪ web-runtime 的三个默认值里有两个与本应用不符（E85）
#
# 依据（`dsh-web-app/lib/index.js`）：`openBrowser` / `printUrl` / `surfaceContext` 的
# 默认值都是 **true**。
#   · `surfaceContext: true` 会**注入一段系统提示**，内容是"你正在通过 DeepSeek Harness
#     Web GUI 与用户交互……浏览器不提供隐式 DOM/路由/截图上下文"（`lib/index.js:177`）。
#     我们的端侧页面是**原生 ArkUI**，不是 Web GUI——留着它等于对模型说了一句假话，
#     而且它会塑造模型对"界面能力"的判断（E85 引用实现的同一处）。
#   · `printUrl: true` **必须保留**：我们的 token 正是从这行 stdout 抓的
#     （`hostcore/app/main.js` 的 `watchdogAuthUrl`）。关掉它等于关掉自己的凭据来源。
#   · `openBrowser: false` 显式写死：端侧没有可打开的浏览器；虽然启动参数里已有
#     `--no-open`，但那是**命令行**层的约定，写在 profile 里的是**部署**层的事实，
#     两者都写，任何一侧被改动时另一侧仍然成立。
- id: web-runtime
  config:
    surfaceContext: false
    printUrl: true
    openBrowser: false

# ① PTY / 进程创建链：node-pty + spawn-helper 需要创建进程（D6 E15）
#    证据：`dsh-subprocess-local` 与 `dsh-sandbox-local` 在真机上因
#    `koffi.struct(...).size === undefined`（E47）先失败；即使 koffi 换成 3.x，
#    这两个插件在本平台仍需要 fork/exec 才能真正工作。
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
# bash/pwsh 执行器（`dsh-bash-sandbox` → `dsh-bash-local`、`dsh-pwsh-sandbox` → `dsh-pwsh-local`，
# 两者的 `static inject = ["subprocess"]`）。provider 禁用后它们必然缺服务。
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
# 两个 shell 工具行：其后端就是上面那两个执行器，留着只会让模型拿到一个必然失败的工具。
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

# ② sharp / libvips（D6 E46）
#    三个独立阻塞点：缺 libvips-cpp.so.42、加载器要建软链（沙箱禁止）、WASM 回退在 jitless 下必失败。
#    恢复线索：`@ohos-ports/img-sharp-libvips-openharmony-arm64/lib/libvips-cpp.so.42.20.3`
#    确实在核心树里，将来可连同依赖搬进 HAP libs 并处理带版本号的 SONAME。
- id: attachment-local
  disabled: false

# ③ "在应用中打开"依赖 subprocess 服务（`@deepseek-ai/dsh-host-open-in-app` 的
#    `inject = ['webServer','connection','subprocess']`）。端侧就是本应用自身，
#    这个"把外部 Host 的产物丢给本机程序打开"的能力没有对应物。
- id: open-in-app
  disabled: true

# ── 依赖级联（**临时**：为了先让插件树起来）────────────────────────────────
#
# dsh 的 boot 要求**所有行都 activate**，所以禁掉一个 provider 会把它下游的消费者
# 拖成 pending，并让整棵树 fail-loud。本地实测（`node --jitless hostcore/app/main.js`，
# 与真机同参）第一轮就打出：
#     dsh: 4 entries did not activate
#     @deepseek-ai/dsh-permission-presets: pending (waiting for service: shell)
#     @deepseek-ai/dsh-api-session-controller: pending (waiting for services: attachments, fileUploads)
#     @deepseek-ai/dsh-client-file-upload: pending (waiting for service: attachments)
#     @deepseek-ai/dsh-client-ui-deliverables: pending (waiting for service: sessionController)
#
# 链路是：`attachment-local`（attachments provider，本例禁用）→ `file-upload`（fileUploads）
# → `session-controller`（sessionController）→ 依赖它的客户端行；另一边
# `bash-sandbox`/`pwsh-sandbox`（shell provider，本例禁用）→ `permission-presets`。
#
# 【这一段是临时的】目的只是把"Host 能否起来"这条主流程跑通。恢复顺序应当是：
#   ① 让 `attachment-local` 真正可用（把 libvips 及其依赖搬进 HAP libs 并处理带版本号的
#      SONAME，见 E46 的恢复线索）→ 撤销下面 3 条；
#   ② shell 链在鸿蒙上没有对应物（无法创建进程，E15）→ 这条级联要长期评估。
# ④ 权限预设（E116）：**端侧无法启用**——实测把它打开会让整棵插件树启动失败：
#     `1 entry did not activate · @deepseek-ai/dsh-permission-presets: pending
#      (waiting for service: shell)`
#    官方该插件需要 `shell` 服务，而 shell 只能由 `bash-sandbox`/`pwsh-sandbox` 提供，
#    两者在鸿蒙上没有对应物（无法创建进程，E15）⇒ 这条链是**上游硬约束**，不是配置问题。
#    三档本身的取值仍然有效（`dsh-sandbox-policy` 的 `SANDBOX_MODES` =
#    `read-only` / `workspace-write` / `danger-full-access`，真机系统提示里也确实写着
#    `Current DSH file policy: workspace-write`），但把它们**捆绑成用户可选预设**的这一层
#    在端侧缺席。客户端因此按官方规则"没有权限组合就不显示选择器"处理，
#    并在设置里如实说明原因（而不是给一个点了没反应的档位）。
- id: permission
  disabled: true
- id: file-upload
  disabled: false
- id: session-controller
  disabled: false
- id: ui-deliverables
  disabled: false

# 端侧 preset：不带 Shell 工具（见 ondevice/agent.cordis.yml）
- id: agent-presets
  config:
    default: ondevice
